<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Xuất hoá đơn điện tử</title>

  <link rel="manifest" href="manifest.json">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  const isStandalone =
    window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true;

  if (isStandalone) {
    // App already installed → redirect immediately
    window.location.replace("https://app3.meinvoice.vn");
  } else {
    // Browser visit → stay long enough to be installable
    setTimeout(() => {
      window.location.replace("https://app3.meinvoice.vn");
    }, 2500);
  }
</script>


</head>
<body>
</body>
</html>
